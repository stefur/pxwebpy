name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Nox
        run: uv sync --no-default-groups --locked --only-group=nox --no-install-project

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: |
          uv run nox -s tests
      
      - name: Build & smoke test
        shell: bash
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
